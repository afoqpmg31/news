<title>VTuberゆっくり影猫、著名人愛結さんに対する侮辱行為で書類送検</title>
<h1>VTuberゆっくり影猫、著名人愛結さんに対する侮辱行為で書類送検</h1>
<p>2025年5月1日、YouTube登録者1500人越えのゆっくり癒星【影猫ちーちゃんVTuber】こと大野 真子氏がYouTube登録者1960万人の愛結さんを侮辱し、書類送検されました。</p>
<p>「あいつはVALORANTの運営だから調子に乗っている。」「死ね。」などといった侮辱・暴言行為を行ったため書類送検されました。</p>
<p>警察の調べに対し大野氏は、「急に登録者が増えてバズってHIKAKINを超えるYouTuberになっているのがムカついた。尊敬している人だった。」と述べており、今後の動向が気になります。</p>
